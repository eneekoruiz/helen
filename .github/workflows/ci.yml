name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  quality:
    name: Quality Gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test -- --maxWorkers=2
      - run: npm run build
      - run: node dist/cli.js lint
      - name: Validate frozen evaluation plans without provider calls
        run: |
          node scripts/run-specialty-evals.mjs --dry-run
          node scripts/run-repo-evals.mjs --suite implementation-holdout
      - run: npm audit --audit-level=high

  windows:
    name: Windows recovery, progress and hook activation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify the complete suite on Windows
        run: npm run test -- --maxWorkers=2

  installed-package:
    name: Installed npm package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify an actual installed tarball outside the checkout
        run: node scripts/verify-package.mjs
      - name: Preserve installed-package verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-package-${{ matrix.os }}-node-${{ matrix.node }}
          path: .helen/audit-results/package-verification-*/
          include-hidden-files: true
          if-no-files-found: warn
